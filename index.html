<!doctype html>
<html><head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Canvas 强反差丝带蛋白</title>
<style>

  :root{
    --bg:transparent; --ink:#8ef5d2; --dim:#3d8a71; --faint:#1d4a3c; --hot:#d6fff1;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:transparent;color-scheme:light}
  body{
    background:var(--bg); color:var(--ink); overflow:hidden;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;
    -webkit-font-smoothing:antialiased;
  }
  html.tp, html.tp body, body.tp{background:transparent}
  html.tp{color-scheme:light}
  html.tp #fx, body.tp #fx{display:none}
  /* the animation itself: one <pre> of live text, rewritten every frame */
  #screen{
    position:fixed; margin:0; white-space:pre; user-select:none; cursor:grab;
    touch-action:pan-y; letter-spacing:0; font-kerning:none; font-variant-ligatures:none;
  }
  #screen.drag{cursor:grabbing}
  #screen.tiny, #screen.tiny span{text-shadow:none}
  /* scanline + vignette overlay for the digital feel */
  #fx{display:none;position:fixed;inset:0;pointer-events:none;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 1px, transparent 1px 3px),
      radial-gradient(ellipse at 50% 46%, transparent 55%, rgba(0,0,0,.55) 100%);
  }
  html.dark #fx, body.dark #fx{display:block}
  .panel{position:fixed;z-index:3;line-height:1.45}
  #hdr{top:14px;left:16px;user-select:none}
  #hdr .t{font-size:15px;letter-spacing:.35em;color:var(--hot);text-shadow:0 0 12px rgba(120,255,210,.35)}
  #hdr .s{font-size:10px;letter-spacing:.18em;color:var(--dim);margin-top:3px}
  #ctl{top:14px;right:16px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end;max-width:60vw}
  #ctl select,#ctl button{
    background:rgba(4,22,17,.82); color:var(--ink); border:1px solid var(--faint);
    font:11px/1.2 inherit; font-family:inherit; padding:5px 9px; border-radius:3px; cursor:pointer;
    letter-spacing:.06em; outline:none;
  }
  #ctl select{max-width:34vw}
  #ctl button:hover,#ctl select:hover{border-color:var(--dim);color:var(--hot)}
  #ctl input[type=range]{width:74px;accent-color:#35c9a0}
  #info{left:16px;bottom:16px;max-width:min(52vw,470px);user-select:none}
  #info .cn{font-size:17px;color:var(--hot);letter-spacing:.12em;text-shadow:0 0 14px rgba(120,255,210,.3);min-height:24px}
  #info .en{font-size:11px;color:var(--ink);opacity:.85;margin-top:2px}
  #info .org{font-size:10px;color:var(--dim);margin-top:4px;letter-spacing:.08em}
  #info .st{font-size:10px;color:var(--dim);margin-top:6px;letter-spacing:.06em}
  #legLine{line-height:1.75;letter-spacing:.02em}
  #legLine span{margin-left:2px}
  #info .st b{color:var(--ink);font-weight:normal}
  #info a{color:#57d8b2;text-decoration:none;border-bottom:1px dotted var(--faint)}
  #info a:hover{color:var(--hot)}
  #cred{right:16px;bottom:16px;font-size:9px;color:var(--dim);text-align:right;letter-spacing:.06em;opacity:.85;user-select:none}
  #cred a{color:var(--dim)}
  .blink{display:inline-block;width:.6em;animation:bl 1s steps(1) infinite}
  @keyframes bl{50%{opacity:0}}
  @media (max-width:640px){
    #hdr .t{font-size:12px}
    #ctl{max-width:92vw;top:56px;right:12px}
    #info{bottom:14px;left:12px;max-width:86vw}
    #info .cn{font-size:14px}
    #info .en{display:none}
    #cred{display:none}
  }
  /* light host page: dark ink, no glow; the CRT scanline/vignette is a dark-page effect */
  body.light #fx{display:none}
  body.light #hdr .t{color:#0d2b24;text-shadow:none}
  body.light #hdr .s{color:#5c7d72}
  body.light #info .cn{color:#0d2b24;text-shadow:none}
  body.light #info .en{color:#26463c}
  body.light #info .org,body.light #info .st,body.light #cred{color:#5c7d72}
  body.light #info .st b{color:#123a30}
  body.light #info a,body.light #cred a{color:#0a7358}
  body.light #ctl select,body.light #ctl button{
    background:rgba(255,255,255,.88);color:#14493c;border-color:#bcd8ce}
  body.light #ctl button:hover,body.light #ctl select:hover{border-color:#57a58d;color:#062e23}
  /* Homepage embed: the molecule is the figure; hide the fullscreen chrome. */
  body.embed #hdr, body.embed #fx,
  body.embed #ctl, body.embed #info, body.embed #cred { display: none; }

  /*
   * Hosted in the homepage slot: keep the paper chrome, but do not use the
   * fullscreen or phone layouts. Those wrap the control row across the
   * molecule and cover the title.
   */
  body.hosted {
    --hosted-composition-scale: 1;
    --hosted-particle-scale: 1;
  }
  body.hosted #hdr {
    top: 8px; left: 10px; max-width: 38%;
  }
  body.hosted #hdr .t { font-size: 10px; letter-spacing: 0.16em; }
  body.hosted #hdr .s { display: none; }
  body.hosted #ctl {
    top: 8px;
    right: 8px;
    left: auto;
    max-width: 68%;
    gap: 3px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }
  body.hosted #ctl select, body.hosted #ctl button {
    font-size: 9px;
    line-height: 1.2;
    padding: 2px 5px;
  }
  body.hosted #ctl select {
    flex: 1 1 16rem;
    min-width: 14rem;
    max-width: min(100%, 26rem);
  }
  body.hosted #ctl input[type=range] { width: 52px; }
  body.hosted #info {
    left: 10px;
    bottom: 8px;
    max-width: min(46%, 16rem);
  }
  body.hosted #info .cn { font-size: 12px; min-height: 0; letter-spacing: 0.06em; }
  body.hosted #info .en { font-size: 9px; }
  body.hosted #info .org, body.hosted #info .st { font-size: 8px; margin-top: 2px; }
  body.hosted #cred {
    right: 8px;
    bottom: 8px;
    max-width: 36%;
    font-size: 7px;
    line-height: 1.35;
  }
  @media (max-width: 640px) {
    body.hosted #ctl { top: 8px; right: 8px; max-width: 68%; }
    body.hosted #info { max-width: min(48%, 15rem); }
    body.hosted #cred { display: block; }
  }
  @media (max-width: 480px) {
    /* Hybrid is homepage-only and the molecule becomes the whole phone stage. */
    html.hosted.hybrid #hdr,
    html.hosted.hybrid #ctl,
    html.hosted.hybrid #info,
    html.hosted.hybrid #cred { display: none; }

    body.hosted {
      --hosted-composition-scale: 0.8;
      --hosted-particle-scale: 0.625;
    }
    body.hosted #hdr,
    body.hosted #ctl,
    body.hosted #info,
    body.hosted #cred { transform: scale(var(--hosted-composition-scale)); }
    body.hosted #hdr { transform-origin: top left; }
    body.hosted #ctl { transform-origin: top right; }
    body.hosted #info { transform-origin: bottom left; }
    body.hosted #cred { transform-origin: bottom right; }

    /* A requested hybrid inside a desktop homepage column can itself be narrow.
       The active html.hybrid class follows the immediate parent responsive surface. */
    html.hosted:not(.hybrid) body.hosted.hybrid {
      --hosted-composition-scale: 1;
      --hosted-particle-scale: 1;
    }
    html.hosted:not(.hybrid) body.hosted.hybrid #hdr,
    html.hosted:not(.hybrid) body.hosted.hybrid #ctl,
    html.hosted:not(.hybrid) body.hosted.hybrid #info,
    html.hosted:not(.hybrid) body.hosted.hybrid #cred { transform: none; }
  }
</style>
<script>
/* Apply overlay classes before the protein payload is parsed.
   Otherwise the default --bg (#020806) paints for the whole download/parse
   of PROTEINS, which is the black flash on a cold Cloudflare load. */
(function(){
  var q = new URLSearchParams(location.search);
  var html = document.documentElement;
  var hosted = q.get("hosted") === "1";
  if ((q.get("bg") || "").toLowerCase() === "transparent") html.classList.add("tp");
  if ((q.get("theme") || "").toLowerCase() === "light") html.classList.add("light");
  if (hosted) html.classList.add("hosted");
  if (hosted && (q.get("render") || "").toLowerCase() === "hybrid") {
    var mobile;
    try {
      if (window.parent && window.parent !== window) {
        var parentWidth = window.parent.innerWidth;
        if (Number.isFinite(parentWidth) && parentWidth > 0) mobile = parentWidth <= 480;
      }
    } catch (e) {}  // cross-origin parent: use the iframe-local media query
    if (mobile === undefined) mobile = matchMedia("(max-width: 480px)").matches;
    if (mobile) html.classList.add("hybrid");
  }
  if (q.get("embed") === "1") html.classList.add("embed");
})();
</script>

<div id="fx"></div>

<div class="panel" id="hdr">
  <div class="t">数字蛋白质</div>

  <button id="ink" title="笔触：实心块字符 / 传统 ASCII 线描">实心</button>
  <button id="play" title="暂停/继续">&#10074;&#10074;</button>
  <!-- Speed adjustment control is disabled; restore this input to expose manual speed selection.
  <input id="spd" type="range" min="0" max="2" step="0.05" value="0.11" title="转速">
  -->
</div>

<div class="panel" id="info">
  <div class="cn"><span id="cnName"></span><span class="blink">_</span></div>
  <div class="en" id="enName"></div>
  <div class="org" id="orgLine"></div>
  <div class="st" id="stLine"></div>
  <div class="st" id="legLine"></div>
</div>

/* ---------- decode packed structures ---------- */
const PARAMS = new URLSearchParams(location.search);
const WORKER_DISABLED = PARAMS.get("worker") === "0" || PARAMS.get("worker") === "fallback";
const OFFSCREEN_SUPPORTED = !WORKER_DISABLED &&
  location.protocol !== "file:" &&
  typeof Worker === "function" &&
  typeof HTMLCanvasElement !== "undefined" &&
  typeof HTMLCanvasElement.prototype.transferControlToOffscreen === "function";
function b64ToBytes(s){
  const bin = atob(s), u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return u8;
}
function decodeProtein(p){
  if (p.XYZ) return p;
  p.XYZ = new Int16Array(b64ToBytes(p.xyz).buffer);  // 1/16 Å units, PCA-aligned, centered
  p.PL  = b64ToBytes(p.pl);                          // per-point pLDDT 0..100
  p.SS  = b64ToBytes(p.ss8);                         // per-point secondary structure 0 loop / 1 helix / 2 sheet
  p.SD  = new Int8Array(b64ToBytes(p.side).buffer);
  p.ND  = new Int8Array(b64ToBytes(p.nrm).buffer);   // ribbon face normal, unit * 127
  p.side = p.nrm = null;
  p.n   = p.XYZ.length / 3;
  p.xyz = p.pl = p.ss = p.ss8 = null;
}
if (!OFFSCREEN_SUPPORTED) {
  for (const p of PROTEINS) decodeProtein(p);
}

if (BGPARAM === "transparent") document.body.classList.add("tp");
else if (BGPARAM === "dark") {
  document.documentElement.style.setProperty("--bg", "#020806");
  document.documentElement.classList.add("dark");
  document.body.classList.add("dark");
} else document.body.style.background = "#" + BGPARAM.replace(/[^0-9a-f]/g, "");

function hexLum(h){
  h = (h||"").replace(/[^0-9a-f]/g,"");
  if(h.length===3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(h.length!==6) return null;
  const r=parseInt(h.slice(0,2),16), g=parseInt(h.slice(2,4),16), b=parseInt(h.slice(4,6),16);
  return (0.2126*r + 0.7152*g + 0.0722*b)/255;
}
function hostLum(){          // what is actually painted behind a transparent page?
  try{
    let node = (window.parent && window.parent !== window)
      ? window.parent.document.body : document.body;
    while(node){
      const m = getComputedStyle(node).backgroundColor
        .match(/rgba?\(([\d.]+),\s*([\d.]+),\s*([\d.]+)(?:,\s*([\d.]+))?\)/);
      if(m && (m[4] === undefined || parseFloat(m[4]) > 0.1))
        return (0.2126*m[1] + 0.7152*m[2] + 0.0722*m[3])/255;
      node = node.parentElement;
    }
  }catch(e){}                // cross-origin parent: fall through to the default below
  return null;               // nothing opaque found => browser default canvas, which is white
}

  solid: " ....::░░▒▒▓▓██",     // gauze only at the rim; the body goes solid
  block: " ░░▒▒▓▓████████",     // maximum opacity, almost no fade
};
let INK = RAMPS[INKPARAM] ? INKPARAM : "solid";
let RAMP = RAMPS[INK];
const SOLIDINK = () => INK !== "ascii";
/* a full block must be painted as a rect: glyph tiling seams on fractional cells */
const fullFrom = () => { const i = RAMP.indexOf("\u2588"); return i < 0 ? 1e9 : i; };
let NR = RAMP.length - 1;
const TILT = -0.18;                      // slight fixed tilt; spin stays on the vertical axis
/* cartoon ribbon: per-ss splat radius (band thickness) and band half-width in Å */
/* exaggerated contrast: wide things wider, thin things thinner */
const RADS = [0.34, 0.30, 0.32, 0.36, 0.30, 0.28, 0.26, 0.22];  // band thickness: thin, like real ribbon
const PADS = [0.30, 0.28, 0.29, 0.32, 0.28, 0.22, 0.20, 0.16];  // cell padding
const HWS  = [2.40, 1.80, 2.10, 1.20, 1.10, 0, 0, 0];     // band half-width in Å; 0 = thread
/* Ceiling set by real packing: strands sit ~4.8 Å apart, helix axes ~10 Å.
   Past half that spacing neighbouring bands fuse into one slab. */
const BANDPAD = 2.3;                     // Å the widest band reaches past the packed bounds
const NOFF = 9;                          // samples across the band width
const FONT = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace";

/* AlphaFold's four hues: blue / cyan / yellow / orange */
const HUES = [
  [0,60,255],    // H α-helix     #003CFF 钴蓝
  [0,168,255],   // G 3₁₀-helix   #00A8FF 亮蓝
  [123,63,242],  // I π-helix     #7B3FF2 紫
  [0,127,112],   // E β-strand    #007F70 深青绿
  [0,192,139],   // B β-bridge    #00C08B 翠绿
  [240,53,0],    // T turn        #F03500 朱红
  [255,158,0],   // S bend        #FF9E00 琥珀
  [208,0,112],   // C coil        #D00070 深洋红
];
if (document.body.classList.contains("hosted")) {
  HUES[0] = [124, 58, 237];  // H α-helix  #7C3AED  Pize purple
  HUES[2] = [0, 60, 255];    // I π-helix  #003CFF  cobalt
}
const NHUE = HUES.length;
/* Alternate colouring modes remain in the renderer for reversible reactivation;
   the public mode control and homepage default stay fixed to structure colours. */
const PLDDT_HUE = [0, 3, 5, 7];        // confidence bands reuse cobalt / teal / vermilion / magenta
/* 12 classes = 4 hues x 3 density tiers.
   On a dark page denser = brighter; on a light page denser = deeper. */
function tierColor(c, t){
  if(LIGHT){
    if(t===0) return [c[0]+(255-c[0])*0.45|0, c[1]+(255-c[1])*0.45|0, c[2]+(255-c[2])*0.45|0];
    if(t===1) return [c[0]+(255-c[0])*0.08|0, c[1]+(255-c[1])*0.08|0, c[2]+(255-c[2])*0.08|0];
    return [c[0]*0.55|0, c[1]*0.55|0, c[2]*0.55|0];
  }
  if(t===0) return [c[0]*0.72|0, c[1]*0.72|0, c[2]*0.72|0];
  if(t===1) return c;                                   // the specified hex, unmodified
  return [c[0]+(255-c[0])*0.58|0, c[1]+(255-c[1])*0.58|0, c[2]+(255-c[2])*0.58|0];
}
const styleEl = document.createElement("style");
{
  let cssText = "";
  for(let h=0;h<NHUE;h++) for(let t=0;t<3;t++){
    const c = tierColor(HUES[h], t);
    const col = "rgb("+c[0]+","+c[1]+","+c[2]+")";
    cssText += ".c"+(h*3+t)+"{color:"+col+(LIGHT ? "" : ";text-shadow:0 0 6px rgba("+c[0]+","+c[1]+","+c[2]+",.35)")+"}\n";
  }
  styleEl.textContent = cssText;
  document.head.appendChild(styleEl);
}

/* canvas build: the same colour classes, as fillStyle strings */
const COLORS = [];
for(let h=0;h<NHUE;h++) for(let t=0;t<3;t++){
  const c = tierColor(HUES[h], t);
  COLORS[h*3+t] = "rgb("+c[0]+","+c[1]+","+c[2]+")";
}
const BUCKETS = []; for(let i=0;i<NHUE*3;i++) BUCKETS.push([]);
const MONOCOL = LIGHT ? "#0f5f4d" : "#8ef5d2";
const MODES = UI.modes;
const LEGENDS = [
  UI.legend,
  "pLDDT&nbsp; <span class='c1'>■</span> &gt;90 &nbsp;<span class='c10'>■</span> 70–90 &nbsp;<span class='c16'>■</span> 50–70 &nbsp;<span class='c22'>■</span> &lt;50",
  "",
];

let W=0,H=0,fs=9,cellW=6,cellH=9,cols=0,rows=0,aspect=0.6;
let canvasDpr=0;
let dens,zw,zsum,plsum,clsW,clsC,fnX,fnY,fnZ,plC,depF,charGrid,clsGrid,rowBuf;
const DEFAULT_ROTATION_SPEED = 0.11;
const DEFAULT_ROTATION_FPS = 16;
let cur=0, ang=0.6, speed=DEFAULT_ROTATION_SPEED, paused=false, pauseOrigin="none";
let speedIsAutomatic=true;
if (document.body.classList.contains("hosted")) {
  speed = DEFAULT_ROTATION_SPEED;
  const spdEl = document.getElementById("spd");
  if (spdEl) spdEl.value = String(DEFAULT_ROTATION_SPEED);
}
let ky=1,kx=1;
let Z=1, panX=0, panY=0;    // wheel zoom factor and pixel pan
let D=1;                    // glyph density: smaller glyphs, same-size molecule
const MOBILE_HOSTED_QUERY = matchMedia("(max-width: 480px)");
const REDUCED_MOTION_QUERY = matchMedia("(prefers-reduced-motion: reduce)");
let activeRenderMode = "grid";
let animationReady = false;
let animationFrameId = null;
let mobileFrameInViewport = true;
let mobileFrameObserver = null;
let mobileVisibilityListenerBound = false;
let mobilePageLifecycleListenersBound = false;
let mobilePageActive = true;
let mobileResizePending = false;
let previousHostedMobile = null;

function workerMessage(type, payload = {}){
  if(!proteinWorker) return false;
  try{
    proteinWorker.postMessage({type, ...payload});
    return true;
  }catch(error){
    handleWorkerFailure(error);
    return false;
  }
}

function workerProteinPayload(){
  return PROTEINS.map(p=>({
    id:p.id, cn:p.cn, orgCn:p.orgCn, name:p.name, org:p.org,
    nres:p.nres, natoms:p.natoms, plddt:p.plddt, url:p.url,
    halfW:p.halfW, halfH:p.halfH, xyz:p.xyz, pl:p.pl, ss8:p.ss8,
    side:p.side, nrm:p.nrm,
  }));
}

function decodeAllForFallback(){
  for(const p of PROTEINS) decodeProtein(p);
}

function restoreCanvasFallback(){
  if(proteinWorker){
    proteinWorker.terminate();
    proteinWorker = null;
  }
  workerCanvas = null;
  workerActive = false;
  workerReady = false;
  workerInitFailed = true;
  decodeAllForFallback();
  /* A transferred canvas cannot be given a 2D context again. Replace it with
     a fresh element so a runtime Worker failure still has a usable fallback. */
  const replacement = document.createElement("canvas");
  replacement.id = "screen";
  replacement.className = scr.className;
  replacement.style.cssText = scr.style.cssText;
  scr.replaceWith(replacement);
  scr = replacement;
  ctx = scr.getContext("2d");
  bindCanvasInteractions();
  bindCanvasZoomInteractions();
  window.__pizeWorkerState = {active:false, ready:false, fallback:true, error:workerLastError};
}

function handleWorkerFailure(error){
  workerLastError = error?.message || String(error);
  if(workerInitFailed) return;
  restoreCanvasFallback();
  resize();
  render();
}

function startProteinWorker(){
  if(!OFFSCREEN_SUPPORTED || workerInitFailed || !scr) return false;
  try{
    /* file:// workers are blocked by browser security policy; leave those
       direct-file previews on the tested Canvas 2D fallback. */
    if(location.protocol === "file:") return false;
    const workerUrl = new URL("./canvas-silk2-worker.js", location.href);
    const worker = new Worker(workerUrl);
    const offscreen = scr.transferControlToOffscreen();
    proteinWorker = worker;
    workerCanvas = offscreen;
    workerActive = true;
    worker.onmessage = event=>{
      const data = event.data || {};
      if(data.type === "ready"){
        workerReady = true;
        window.__pizeWorkerState = {active:true, ready:true, fallback:false, error:null};
        syncAnimationLoop();
      }else if(data.type === "error"){
        handleWorkerFailure(data.message || "Worker rendering failed");
      }
    };
    worker.onerror = event=>handleWorkerFailure(event.error || event.message || "Worker failed to load");
    window.__pizeWorkerState = {active:true, ready:false, fallback:false, error:null};
    worker.postMessage({
      type:"init",
      canvas:offscreen,
      proteins:workerProteinPayload(),
      render:{
        current:cur, tilt:TILT, light:LIGHT, mode, ink:INK, density:D,
        ramp:RAMP, colors:COLORS, renderMode:activeRenderMode,
      },
    }, [offscreen]);
    return true;
  }catch(error){
    workerLastError = error?.message || String(error);
    if(workerActive || workerCanvas){
      handleWorkerFailure(error);
      return false;
    }
    if(proteinWorker) proteinWorker.terminate();
    proteinWorker = null;
    workerCanvas = null;
    workerActive = false;
    workerReady = false;
    decodeAllForFallback();
    ctx = scr.getContext("2d");
    window.__pizeWorkerState = {active:false, ready:false, fallback:true, error:workerLastError};
    return false;
  }
}

function syncAutomaticSpeed(){
  if(!document.body.classList.contains("hosted") || !speedIsAutomatic) return;
  speed = DEFAULT_ROTATION_SPEED;
  const spdEl = document.getElementById("spd");
  if(spdEl) spdEl.value = String(speed);
}

function hostedMobile(){
  if(!document.body.classList.contains("hosted")) return false;
  try{
    if(window.parent && window.parent !== window){
      const parentWidth=window.parent.innerWidth;
      if(Number.isFinite(parentWidth) && parentWidth>0) return parentWidth<=480;
    }
  }catch(e){}  // cross-origin parent: use the iframe-local media query
  return MOBILE_HOSTED_QUERY.matches;
}

function resolvedRenderMode(){
  return requestedRenderMode === "hybrid" && hostedMobile() ? "hybrid" : "grid";
}

function hostedCompositionScale(){
  if(!document.body.classList.contains("hosted")) return 1;
  const scale = parseFloat(getComputedStyle(document.body).getPropertyValue("--hosted-composition-scale"));
  return Number.isFinite(scale) ? scale : 1;
}

function hostedParticleScale(){
  if(!document.body.classList.contains("hosted")) return 1;
  const scale = parseFloat(getComputedStyle(document.body).getPropertyValue("--hosted-particle-scale"));
  return Number.isFinite(scale) ? scale : 1;
}

function fitProtein(compositionScale = hostedCompositionScale()){
  const p = PROTEINS[cur];
  const hW = p.halfW + BANDPAD, hH = p.halfH + BANDPAD;
  const effH = hH*Math.cos(TILT) + hW*Math.abs(Math.sin(TILT));
  const hosted = document.body.classList.contains("hosted");
  const fill = activeRenderMode === "hybrid" ? 0.55 : (hosted ? 0.52*compositionScale : 0.47);
  ky = Math.min(cols*Z*fill*aspect/hW, rows*Z*fill/effH);
  kx = ky/aspect;
}

function targetCanvasDpr(){
  return Math.min(activeRenderMode === "hybrid" ? 3 : 2.5, devicePixelRatio || 1);
}

function syncRenderMode(){
  activeRenderMode = resolvedRenderMode();
  document.documentElement.classList.toggle("hybrid", activeRenderMode === "hybrid");
  syncAutomaticSpeed();
}

function resize(){
  W = innerWidth; H = innerHeight;
  syncRenderMode();
  const compositionScale = hostedCompositionScale();
  fs = FSPARAM || (W>1100 ? 4.5 : (W>700 ? 4 : 3.5));   // half-size chars: 4x the character count
  fs = fs * compositionScale * Z / D;    // phone composition, zoom, and density all scale glyphs
  if(SOLIDINK()) fs = Math.max(2, Math.round(fs));   // blocks seam on fractional pixels
  fs *= hostedParticleScale();            // finer phone grid without changing the molecule footprint
  if(fs < 2.2) fs = 2.2;                 // below ~2px antialiasing melts glyphs into fog
  scr.classList.toggle("tiny", fs < 6);                 // glow is invisible below ~6px and costs paint time
  scr.style.font = fs + "px " + FONT;
  scr.style.lineHeight = fs + "px";
  /* measure the real character advance of the chosen monospace font */
  const meas = document.createElement("span");
  meas.style.cssText = "position:absolute;visibility:hidden;white-space:pre;font:" + fs + "px " + FONT;
  meas.textContent = "@".repeat(200);
  document.body.appendChild(meas);
  cellW = meas.getBoundingClientRect().width / 200;
  document.body.removeChild(meas);
  cellH = fs;
  aspect = cellW/cellH;
  cols = Math.min(560, Math.floor(W/cellW));
  rows = Math.min(320, Math.floor(H/cellH));
  scr.style.left = ((W - cols*cellW)/2) + "px";
  scr.style.top  = ((H - rows*cellH)/2) + "px";
  canvasDpr = targetCanvasDpr();
  scr.style.width  = (cols*cellW) + "px";
  scr.style.height = (rows*cellH) + "px";
  const backingWidth = Math.round(cols*cellW*canvasDpr);
  const backingHeight = Math.round(rows*cellH*canvasDpr);
  if(workerActive){
    fitProtein(compositionScale);
    workerMessage("resize", {
      width:W, height:H, backingWidth, backingHeight, dpr:canvasDpr,
      cols, rows, cellW, cellH, fs, kx, ky, aspect, panX, panY,
      renderMode:activeRenderMode, mode, ink:INK, density:D, ramp:RAMP,
    });
    return;
  }
  if(!ctx) ctx = scr.getContext("2d");
  scr.width  = backingWidth;
  scr.height = backingHeight;
  ctx.setTransform(canvasDpr, 0, 0, canvasDpr, 0, 0);
  ctx.font = fs + "px " + FONT;
  ctx.textBaseline = "top";
  const nCell = cols*rows;
  dens  = new Float32Array(nCell);
  zw    = new Float32Array(nCell);
  zsum  = new Float32Array(nCell);
  plsum = new Float32Array(nCell);
  clsW  = new Float32Array(nCell);   // strongest contribution seen in this cell
  clsC  = new Uint8Array(nCell);     // and which DSSP class produced it
  fnX   = new Float32Array(nCell);   // the ribbon face normal it carried
  fnY   = new Float32Array(nCell);
  fnZ   = new Float32Array(nCell);
  plC   = new Uint8Array(nCell);     // pLDDT of the winning band
  depF  = new Float32Array(nCell);
  charGrid = new Uint8Array(nCell);
  clsGrid  = new Uint8Array(nCell);
  rowBuf = new Array(rows);
  fitProtein(compositionScale);
}
function resizeStaticFrame(){
  /* A mode switch must update geometry even while the mobile loop is gated. */
  mobileResizePending = false;
  resize();
  if(!workerActive) render();
}
function handleViewportResize(){
  if(hostedMobile() && !mobileAnimationCanRun()){
    if(activeRenderMode !== resolvedRenderMode()) resizeStaticFrame();
    else{
      mobileResizePending = true;
      syncRenderMode();
    }
    configureMobileAnimationLifecycle();
    syncAnimationLoop();
    return;
  }
  mobileResizePending = false;
  resize();
  configureMobileAnimationLifecycle();
  syncAnimationLoop();
}
addEventListener("resize", handleViewportResize);

function hybridColor(ss, pl){
  if(mode === 2) return MONOCOL;
  const hue = mode === 0 ? ss : PLDDT_HUE[pl>90 ? 0 : pl>70 ? 1 : pl>50 ? 2 : 3];
  return COLORS[hue*3+1];
}

const HYBRID_LIGHT_TINT = LIGHT ? "#acd5ca" : "#afe8d5";
const HYBRID_SHADOW_TINT = LIGHT ? "#173747" : "#09201b";
const HYBRID_LX=-0.46, HYBRID_LY=-0.52, HYBRID_LZ=0.72;

function hybridPoint(p, i, ca, sa, ct, st, ox, oy){
  const x=p.XYZ[3*i]*0.0625, y=p.XYZ[3*i+1]*0.0625, z=p.XYZ[3*i+2]*0.0625;
  const rx=x*ca+z*sa, rz=-x*sa+z*ca;
  const ty=y*ct-rz*st, tz=y*st+rz*ct;
  const sx0=p.SD[3*i]/127, sy0=p.SD[3*i+1]/127, sz0=p.SD[3*i+2]/127;
  const sxr=sx0*ca+sz0*sa, szr=-sx0*sa+sz0*ca;
  const syt=sy0*ct-szr*st;
  const nx0=p.ND[3*i]/127, ny0=p.ND[3*i+1]/127, nz0=p.ND[3*i+2]/127;
  const nxr=nx0*ca+nz0*sa, nzr=-nx0*sa+nz0*ca;
  const nyt=ny0*ct-nzr*st, nzt=ny0*st+nzr*ct;
  const scale=ky*cellH;
  return {
    x:(ox+rx*kx)*cellW,
    y:(oy-ty*ky)*cellH,
    z:tz,
    sx:sxr*scale,
    sy:-syt*scale,
    nx:nxr,
    ny:-nyt,
    nz:nzt,
  };
}

function hybridContinuous(p, i){
  const dx=(p.XYZ[3*i+3]-p.XYZ[3*i])*0.0625;
  const dy=(p.XYZ[3*i+4]-p.XYZ[3*i+1])*0.0625;
  const dz=(p.XYZ[3*i+5]-p.XYZ[3*i+2])*0.0625;
  return dx*dx+dy*dy+dz*dz < 64;
}

function drawHybridGeometry(p, ca, sa, ct, st, ox, oy){
  const segments=[];
  for(let i=0;i<p.n-1;i++){
    if(!hybridContinuous(p, i)) continue;
    const a=hybridPoint(p,i,ca,sa,ct,st,ox,oy);
    const b=hybridPoint(p,i+1,ca,sa,ct,st,ox,oy);
    const ss0=p.SS[i], ss1=p.SS[i+1];
    const face=HWS[ss0]>0 && HWS[ss1]>0;
    const color=hybridColor(ss0, (p.PL[i]+p.PL[i+1])*0.5);
    let nx=(a.nx+b.nx)*0.5, ny=(a.ny+b.ny)*0.5, nz=(a.nz+b.nz)*0.5;
    if(nz<0){ nx=-nx; ny=-ny; nz=-nz; }
    const normalScale=1/(Math.hypot(nx,ny,nz)||1);
    nx*=normalScale; ny*=normalScale; nz*=normalScale;
    const light=Math.max(0, nx*HYBRID_LX+ny*HYBRID_LY+nz*HYBRID_LZ);
    const depth=Math.max(0, Math.min(1, ((a.z+b.z)*0.5+p.halfW)/(2*p.halfW)));
    segments.push({
      i,
      a,
      b,
      face,
      color,
      depth:(a.z+b.z)*0.5,
      alpha:0.58+depth*0.10,
      light,
      hw0:HWS[ss0],
      hw1:HWS[ss1],
      width:Math.max(2, (RADS[ss0]+RADS[ss1])*ky*cellH),
    });
  }
  for(let i=0;i<segments.length;i++){
    const segment=segments[i];
    const previous=segments[i-1], next=segments[i+1];
    segment.overlapStart=previous && previous.i+1===segment.i && previous.color===segment.color;
    segment.overlapEnd=next && segment.i+1===next.i && next.color===segment.color;
  }
  segments.sort((a,b)=>a.depth-b.depth);
  ctx.save();
  ctx.lineCap="round";
  ctx.lineJoin="round";
  for(const segment of segments){
    const dx=segment.b.x-segment.a.x, dy=segment.b.y-segment.a.y;
    const length=Math.hypot(dx,dy) || 1;
    const ux=dx/length, uy=dy/length;
    const overlap=0.5/canvasDpr;
    const ax=segment.a.x-ux*(segment.overlapStart ? overlap : 0);
    const ay=segment.a.y-uy*(segment.overlapStart ? overlap : 0);
    const bx=segment.b.x+ux*(segment.overlapEnd ? overlap : 0);
    const by=segment.b.y+uy*(segment.overlapEnd ? overlap : 0);
    const lightMix=Math.max(0, segment.light-0.42)*0.30;
    const shadowMix=Math.max(0, 0.42-segment.light)*0.32;
    ctx.globalCompositeOperation="source-over";
    ctx.globalAlpha=segment.alpha;
    ctx.fillStyle=segment.color;
    ctx.strokeStyle=segment.color;
    if(segment.face){
      ctx.beginPath();
      ctx.moveTo(ax+segment.a.sx*segment.hw0, ay+segment.a.sy*segment.hw0);
      ctx.lineTo(bx+segment.b.sx*segment.hw1, by+segment.b.sy*segment.hw1);
      ctx.lineTo(bx-segment.b.sx*segment.hw1, by-segment.b.sy*segment.hw1);
      ctx.lineTo(ax-segment.a.sx*segment.hw0, ay-segment.a.sy*segment.hw0);
      ctx.closePath();
      ctx.fill();
      ctx.globalCompositeOperation="source-atop";
      if(lightMix>0){ ctx.globalAlpha=lightMix; ctx.fillStyle=HYBRID_LIGHT_TINT; ctx.fill(); }
      else if(shadowMix>0){ ctx.globalAlpha=shadowMix; ctx.fillStyle=HYBRID_SHADOW_TINT; ctx.fill(); }

      const plusPointsUpperLeft=(segment.a.sx+segment.a.sy+segment.b.sx+segment.b.sy)<0;
      const upperSign=plusPointsUpperLeft ? 1 : -1;
      const edgeWidth=Math.max(0.55, Math.min(1.3, segment.width*0.12));
      ctx.lineWidth=edgeWidth;
      ctx.globalAlpha=0.17;
      ctx.strokeStyle=HYBRID_LIGHT_TINT;
      ctx.beginPath();
      ctx.moveTo(ax+upperSign*segment.a.sx*segment.hw0, ay+upperSign*segment.a.sy*segment.hw0);
      ctx.lineTo(bx+upperSign*segment.b.sx*segment.hw1, by+upperSign*segment.b.sy*segment.hw1);
      ctx.stroke();
      ctx.globalAlpha=0.14;
      ctx.strokeStyle=HYBRID_SHADOW_TINT;
      ctx.beginPath();
      ctx.moveTo(ax-upperSign*segment.a.sx*segment.hw0, ay-upperSign*segment.a.sy*segment.hw0);
      ctx.lineTo(bx-upperSign*segment.b.sx*segment.hw1, by-upperSign*segment.b.sy*segment.hw1);
      ctx.stroke();
    }else{
      ctx.lineWidth=segment.width;
      ctx.beginPath();
      ctx.moveTo(ax,ay);
      ctx.lineTo(bx,by);
      ctx.stroke();
      ctx.globalCompositeOperation="source-atop";
      if(lightMix>0){ ctx.globalAlpha=lightMix; ctx.strokeStyle=HYBRID_LIGHT_TINT; ctx.stroke(); }
      else if(shadowMix>0){ ctx.globalAlpha=shadowMix; ctx.strokeStyle=HYBRID_SHADOW_TINT; ctx.stroke(); }
      const edgeWidth=Math.max(0.55, segment.width*0.22);
      ctx.lineWidth=edgeWidth;
      ctx.globalAlpha=0.17;
      ctx.strokeStyle=HYBRID_LIGHT_TINT;
      ctx.beginPath();
      ctx.moveTo(ax-0.6,ay-0.6);
      ctx.lineTo(bx-0.6,by-0.6);
      ctx.stroke();
      ctx.globalAlpha=0.14;
      ctx.strokeStyle=HYBRID_SHADOW_TINT;
      ctx.beginPath();
      ctx.moveTo(ax+0.7,ay+0.7);
      ctx.lineTo(bx+0.7,by+0.7);
      ctx.stroke();
    }
  }
  ctx.globalAlpha=1;
  ctx.globalCompositeOperation="source-over";
  ctx.restore();
}

function render(){
  if(workerActive){
    workerMessage("frame", {angle:ang});
    return;
  }
  if(!ctx) return;
  if(cols < 2 || rows < 2) return;      // not laid out yet (hidden pane / 0-size iframe)
  const p = PROTEINS[cur];
  const XYZ = p.XYZ, PL = p.PL, SS = p.SS, n = p.n;
  dens.fill(0); zw.fill(0); zsum.fill(0); plsum.fill(0);
  clsW.fill(0);
  const ca=Math.cos(ang), sa=Math.sin(ang), ct=Math.cos(TILT), st=Math.sin(TILT);
  const ox = cols*0.5 + panX/cellW, oy = rows*0.5 + panY/cellH;
  /* per-class tube kernels: thin loops keep the voids between elements visible */
  const radxC=new Float64Array(NHUE), radyC=new Float64Array(NHUE),
        irx2C=new Float64Array(NHUE), iry2C=new Float64Array(NHUE);
  for(let c=0;c<NHUE;c++){
    /* A hairline is "one character wide" — a screen-space quantity. Below that the splat
       misses every cell centre and the surface blur erases it, so clamp in cells, not Å. */
    radyC[c] = Math.max(RADS[c]*ky + PADS[c], 0.95);
    radxC[c] = Math.max(RADS[c]*kx + PADS[c], 0.95/aspect);
    irx2C[c] = 1/(radxC[c]*radxC[c]); iry2C[c] = 1/(radyC[c]*radyC[c]);
  }
  const dScale = 1/(2*p.halfW);
  const SD = p.SD, ND = p.ND;
  for(let i=0;i<n;i++){
    const x=XYZ[3*i]*0.0625, y=XYZ[3*i+1]*0.0625, z=XYZ[3*i+2]*0.0625;
    const rx =  x*ca + z*sa;
    const rz = -x*sa + z*ca;
    const ty =  y*ct - rz*st;
    const tz =  y*st + rz*ct;
    const pl = PL[i], ss = SS[i];
    /* rotate the ribbon side vector with the molecule */
    const sx0=SD[3*i]/127, sy0=SD[3*i+1]/127, sz0=SD[3*i+2]/127;
    const sxr =  sx0*ca + sz0*sa;
    const szr = -sx0*sa + sz0*ca;
    const syt =  sy0*ct - szr*st;
    const szt =  sy0*st + szr*ct;
    /* the band's own surface normal, carried through the same rotation */
    const nx0=ND[3*i]/127, ny0=ND[3*i+1]/127, nz0=ND[3*i+2]/127;
    const nxr =  nx0*ca + nz0*sa;
    const nzr = -nx0*sa + nz0*ca;
    const fny =  ny0*ct - nzr*st;
    const fnz =  ny0*st + nzr*ct;
    let hw = HWS[ss];
    if(hw > 0){                            // taper where a band meets a loop
      const sPrev = i>0 ? SS[i-1] : ss, sNext = i<n-1 ? SS[i+1] : ss;
      if(sPrev !== ss || sNext !== ss) hw *= 0.55;
    }
    const nOff = hw > 0 ? NOFF : 1;
    const radx = radxC[ss], rady = radyC[ss], irx2 = irx2C[ss], iry2 = iry2C[ss];
    /* spread the point into a flat band along the side vector */
    for(let o=0; o<nOff; o++){
      const f = nOff===1 ? 0 : (o/(nOff-1)*2-1)*hw;
      const bx = rx + f*sxr, by = ty + f*syt, bz = tz + f*szt;
      const cxp = ox + bx*kx;
      const cyp = oy - by*ky;
      let dep = (bz + p.halfW)*dScale; if(dep<0)dep=0; else if(dep>1)dep=1;
      const zf = Math.exp(bz*0.11);          // front points dominate color/depth
      const x0=Math.max(1,Math.ceil(cxp-radx)), x1=Math.min(cols-2,Math.floor(cxp+radx));
      const y0=Math.max(1,Math.ceil(cyp-rady)), y1=Math.min(rows-2,Math.floor(cyp+rady));
      for(let iy=y0; iy<=y1; iy++){
        const dy=iy-cyp, qy=dy*dy*iry2, row=iy*cols;
        for(let ix=x0; ix<=x1; ix++){
          const dx=ix-cxp;
          const q = dx*dx*irx2 + qy;
          if(q>=1) continue;
          const w = (1-q)*(1-q);
          const j = row+ix;
          dens[j] += w;
          const wz = w*zf;
          zw[j] += wz; zsum[j] += wz*dep; plsum[j] += wz*pl;
          if(wz > clsW[j]){ clsW[j] = wz; clsC[j] = ss;
                            fnX[j] = nxr; fnY[j] = fny; fnZ[j] = fnz;
                            plC[j] = pl; }   // and its facing and confidence
        }
      }
    }
  }
  /* no blur: the ribbon is thin and the daylight between helix turns is the point —
     nine samples across the band already keep its face continuous */
  /* per-cell depth field (for fog + occlusion seams) */
  const nCell = cols*rows;
  for(let j=0;j<nCell;j++) depF[j] = dens[j] < 0.045 ? -1 : zsum[j]/(zw[j]+1e-9);
  /* shade: brightness lives in the character, hue in the span class */
  charGrid.fill(0);
  const LX=-0.46, LY=-0.52, LZ=0.72;        // light dir (upper-left, toward viewer)
  const HX=-0.32, HY=-0.36, HZ=0.88;        // half vector for spec (view = +Z)
  const iasp = 1/aspect;
  for(let iy=1; iy<rows-1; iy++){
    const row = iy*cols;
    for(let ix=1; ix<cols-1; ix++){
      const j = row+ix;
      const d = dens[j];
      if(d < 0.045) continue;
      const a = 1 - Math.exp(-d*(SOLIDINK() ? 9.1 : 4.8));
      /* A ribbon is a surface with two sides. Shade it by its own face normal, not by the
         blob gradient — that is what makes a twisting band read as a band: the face turns
         away, dims, narrows to its edge, then comes back as the other side. */
      let nx = (dens[j-1]-dens[j+1])*iasp;
      let ny = (dens[j-cols]-dens[j+cols]);
      let nz = 0.95;
      let il = 1/Math.sqrt(nx*nx+ny*ny+nz*nz);
      nx*=il; ny*=il; nz*=il;
      let back = false, edge = 0;
      const hasFace = HWS[clsC[j]] > 0;
      if(hasFace){
        let fx = fnX[j], fy = fnY[j], fz = fnZ[j];
        edge = 1 - Math.abs(fz);            // 1 when the band is edge-on to the viewer
        if(fz < 0){ fx=-fx; fy=-fy; fz=-fz; back = true; }   // we are seeing the underside
        const m = 0.78;                     // mostly the true face, a little blob rounding
        nx = fx*m + nx*(1-m); ny = fy*m + ny*(1-m); nz = fz*m + nz*(1-m);
        il = 1/Math.sqrt(nx*nx+ny*ny+nz*nz); nx*=il; ny*=il; nz*=il;
      }
      let diff = nx*LX + ny*LY + nz*LZ; if(diff<0) diff=0;
      diff *= Math.sqrt(diff);                 // ^1.5 light falloff
      let sh = nx*HX + ny*HY + nz*HZ; if(sh<0) sh=0;
      sh *= sh; sh *= sh; sh *= sh; sh *= sh;      // ^16
      const dep = depF[j];
      const fog = 0.46 + 0.54*dep;
      /* occlusion seam: a much nearer neighbor means this cell sits behind an edge */
      let occ = 1;
      const dl=depF[j-1], dr=depF[j+1], du=depF[j-cols], dd=depF[j+cols];
      const dmax = Math.max(dl,dr,du,dd);
      if(dmax - dep > 0.10) occ = 0.42;
      /* ink amount. On a dark page light = ink; on a white page it is the reverse —
         lit faces stay bare paper and shadows take the ink, else highlights print black. */
      let b;
      if(LIGHT){
        let lit = ((0.38 + 1.5*diff)*fog + sh*0.75)*occ;   // lighting without coverage baked in
        if(lit>1)lit=1;
        lit = Math.pow(lit, 0.70);
        lit = 0.4*lit + 0.6*lit*lit*(3-2*lit);
        const av = 1 - Math.pow(1-a, 1.8);     // pale chars vanish on paper: lift partial coverage
        if(hasFace){ if(back) lit *= 0.52; lit += edge*edge*edge*0.30; if(lit>1)lit=1; }
        b = av*(1 - 0.55*lit);                 // full light still keeps 45% ink, shadows go solid
      }else{
        b = (a*(0.46 + 1.5*diff)*fog + sh*0.75*a)*occ;   // stronger sheen for the silk look
        if(b>1)b=1;
        b = Math.pow(b, 0.70);                  // gamma lift
        b = 0.4*b + 0.6*b*b*(3-2*b);          // partial smoothstep contrast
        if(hasFace){ if(back) b *= 0.58;             // the underside of a ribbon is dark
                     b += edge*edge*edge*0.30*a; }    // the edge catches a highlight
      }
      if(b>1)b=1;
      let ci = (b*NR)|0; if(ci===0 && a>0.2) ci=1;
      if(ci===0) continue;
      charGrid[j] = ci;
      /* hue class */
      let hue;
      const plv = plC[j];
      if(mode===0){
        hue = clsC[j];                         // one hue per DSSP class
      }else{
        hue = PLDDT_HUE[plv>90 ? 0 : plv>70 ? 1 : plv>50 ? 2 : 3];
      }
      clsGrid[j] = hue*3 + (b>0.50 ? 2 : (b>0.20 ? 1 : 0));   // deep hues: reach the lit tiers sooner
    }
  }
  /* draw the frame: glyphs bucketed by colour class to minimise fillStyle switches */
  ctx.clearRect(0, 0, cols*cellW, rows*cellH);
  if(activeRenderMode === "hybrid") drawHybridGeometry(p,ca,sa,ct,st,ox,oy);
  ctx.save();
  if(activeRenderMode === "hybrid") ctx.globalAlpha=0.25;
  if(mode===2){
    ctx.fillStyle = MONOCOL;
    for(let iy=0; iy<rows; iy++){
      const row = iy*cols, y = iy*cellH;
      for(let ix=0; ix<cols; ix++){
        const ci = charGrid[row+ix];
        if(ci) ctx.fillText(RAMP[ci], ix*cellW, y);
      }
    }
  }else{
    for(let k=0;k<BUCKETS.length;k++) BUCKETS[k].length = 0;
    for(let iy=0; iy<rows; iy++){
      const row = iy*cols;
      for(let ix=0; ix<cols; ix++){
        const ci = charGrid[row+ix];
        if(ci) BUCKETS[clsGrid[row+ix]].push(ix, iy, ci);
      }
    }
    const seamOverlap = hostedMobile() ? Math.min(0.6, cellW*0.2) : 0.6;
    for(let k=0;k<BUCKETS.length;k++){
      const arr = BUCKETS[k];
      if(!arr.length) continue;
      ctx.fillStyle = COLORS[k];
      for(let i=0;i<arr.length;i+=3){
        const ci = arr[i+2];
        if(SOLIDINK() && ci >= fullFrom()) ctx.fillRect(arr[i]*cellW, arr[i+1]*cellH, cellW+seamOverlap, cellH+seamOverlap);
        else ctx.fillText(RAMP[ci], arr[i]*cellW, arr[i+1]*cellH);
      }
    }
  }
  ctx.restore();
}

/* All render modes use the mobile baseline: 0.11 rad/s at 16fps (0.394°/frame).
   ?fps=30 (1-60) remains available as an explicit diagnostic override. */
const FPSQUERY = parseFloat(new URLSearchParams(location.search).get("fps"));
const FPSPARAM = Number.isFinite(FPSQUERY) && FPSQUERY > 0 ? Math.min(60, Math.max(1, FPSQUERY)) : 0;
function targetFrameRate(){
  if(FPSPARAM) return FPSPARAM;
  return DEFAULT_ROTATION_FPS;
}

function mobileAnimationCanRun(){
  return !paused &&
    mobilePageActive &&
    document.visibilityState === "visible" &&
    mobileFrameInViewport &&
    !REDUCED_MOTION_QUERY.matches;
}

function animationLoopCanRun(){
  return !hostedMobile() || mobileAnimationCanRun();
}

let lastDraw = performance.now();

function queueAnimationFrame(){
  if(!animationReady || animationFrameId !== null || !animationLoopCanRun()) return;
  animationFrameId = requestAnimationFrame(frame);
}

function syncAnimationLoop(){
  if(!animationReady) return;
  if(!animationLoopCanRun()){
    if(animationFrameId !== null) cancelAnimationFrame(animationFrameId);
    animationFrameId = null;
    return;
  }
  if(animationFrameId === null){
    if(hostedMobile()) lastDraw = performance.now() - 1000/targetFrameRate();
    queueAnimationFrame();
  }
}

function setMobileFrameInViewport(value){
  const next = Boolean(value);
  if(next === mobileFrameInViewport) return;
  mobileFrameInViewport = next;
  syncAnimationLoop();
}

function handleMobileDocumentVisibility(){
  const mobile = hostedMobile();
  if(document.visibilityState !== "visible"){
    if(mobile) syncAnimationLoop();
    return;
  }
  if(!mobile && previousHostedMobile !== true) return;
  if(mobile && previousHostedMobile === false && animationFrameId !== null){
    cancelAnimationFrame(animationFrameId);
    animationFrameId = null;
  }
  syncDeferredMobileViewport();
  configureMobileAnimationLifecycle();
  syncAnimationLoop();
}

function handleMobilePageHide(){
  if(!hostedMobile()) return;
  mobilePageActive = false;
  disconnectMobileFrameObserver();
  syncAnimationLoop();
}

function handleMobilePageShow(event){
  const mobile = hostedMobile();
  mobilePageActive = true;
  if(mobile && event && event.persisted && animationFrameId !== null){
    cancelAnimationFrame(animationFrameId);
    animationFrameId = null;
  }
  if(mobile) syncDeferredMobileViewport();
  configureMobileAnimationLifecycle();
  syncAnimationLoop();
}

function disconnectMobileFrameObserver(){
  if(mobileFrameObserver){
    mobileFrameObserver.disconnect();
    mobileFrameObserver = null;
  }
}

function syncDeferredMobileViewport(){
  if(!hostedMobile()) return;
  if(activeRenderMode !== resolvedRenderMode()){
    resizeStaticFrame();
    return;
  }
  if(
    W !== innerWidth ||
    H !== innerHeight ||
    canvasDpr !== targetCanvasDpr()
  ){
    mobileResizePending = true;
    syncRenderMode();
  }
}

function configureMobileAnimationLifecycle(){
  const mobile = hostedMobile();
  const enteringDesktop = !mobile && previousHostedMobile !== false;
  if(mobile && previousHostedMobile === false && pauseOrigin === "desktop-reduced"){
    paused = false;
    pauseOrigin = "none";
  }

  if(!mobilePageLifecycleListenersBound){
    addEventListener("pagehide", handleMobilePageHide);
    addEventListener("pageshow", handleMobilePageShow);
    mobilePageLifecycleListenersBound = true;
  }
  if(!mobileVisibilityListenerBound){
    document.addEventListener("visibilitychange", handleMobileDocumentVisibility);
    mobileVisibilityListenerBound = true;
  }

  if(!mobile){
    if(enteringDesktop && REDUCED_MOTION_QUERY.matches && !paused){
      paused = true;
      pauseOrigin = "desktop-reduced";
    }
    previousHostedMobile = false;
    disconnectMobileFrameObserver();
    setMobileFrameInViewport(true);
    mobilePageActive = true;
    return;
  }

  previousHostedMobile = true;

  if(window.parent === window){
    setMobileFrameInViewport(true);
    return;
  }
  if(mobileFrameObserver) return;

  try{
    const frameElement = window.frameElement;
    const ParentIntersectionObserver = window.parent.IntersectionObserver;
    if(!frameElement || typeof ParentIntersectionObserver !== "function"){
      setMobileFrameInViewport(true);
      return;
    }
    setMobileFrameInViewport(false);
    mobileFrameObserver = new ParentIntersectionObserver((entries)=>{
      const entry = entries[0];
      setMobileFrameInViewport(Boolean(
        entry &&
        entry.isIntersecting &&
        entry.intersectionRatio > 0 &&
        entry.intersectionRect.width > 0 &&
        entry.intersectionRect.height > 0
      ));
    }, {threshold:[0]});
    mobileFrameObserver.observe(frameElement);
  }catch(e){
    disconnectMobileFrameObserver();
    setMobileFrameInViewport(true);
  }
}

function frame(t){
  animationFrameId = null;
  if(!animationLoopCanRun()) return;
  queueAnimationFrame();
  if(mobileResizePending || activeRenderMode !== resolvedRenderMode()){
    mobileResizePending = false;
    resize();
  }
  const frameMs = 1000/targetFrameRate();
  if(t - lastDraw < frameMs - 0.5) return;      // hold to the target frame rate
  const dt = Math.min(0.1, (t-lastDraw)/1000); lastDraw = t;
  if(W !== innerWidth || H !== innerHeight || canvasDpr !== targetCanvasDpr()) resize();   // catches visibility and DPR-only changes
  if(cols < 4 && innerWidth > 0) resize();   // recover from loading while hidden (0-size viewport)
  if(!paused && !dragging) ang += speed*dt;
  render();
}

/* ---------- ui ---------- */
const sel = document.getElementById("sel");
PROTEINS.forEach((p,i)=>{
  const o = document.createElement("option");
  o.value = i; o.textContent = (i+1)+" · "+proteinTitle(p);
  sel.appendChild(o);
});
let typeTimer = null;
function typeName(el, str){
  clearInterval(typeTimer);
  let i = 0; el.textContent = "";
  typeTimer = setInterval(()=>{
    i++; el.textContent = str.slice(0,i);
    if(i>=str.length) clearInterval(typeTimer);
  }, 26);
}
function show(i){
  cur = (i+PROTEINS.length)%PROTEINS.length;
  sel.value = cur;
  const p = PROTEINS[cur];
  typeName(document.getElementById("cnName"), proteinTitle(p));
  document.getElementById("enName").textContent = UI_LOCALE === "en" ? p.id : p.name;
  document.getElementById("orgLine").innerHTML =
    proteinOrg(p)+" · <i>"+p.org+"</i> · <a href='"+p.url+"' target='_blank' rel='noopener'>"+p.id+" ↗</a>";
  document.getElementById("stLine").innerHTML =
    UI.residues+" <b>"+p.nres+"</b> &nbsp;"+UI.atoms+" <b>"+p.natoms+"</b> &nbsp;"+UI.plddt+" <b>"+p.plddt+"</b>";
  fitProtein();
  workerMessage("select", {index:cur});
}
sel.addEventListener("change", ()=>show(+sel.value));
document.getElementById("prev").addEventListener("click", ()=>show(cur-1));
document.getElementById("next").addEventListener("click", ()=>show(cur+1));
const playBtn = document.getElementById("play");
playBtn.addEventListener("click", ()=>{
  paused = !paused;
  pauseOrigin = paused ? "user" : "none";
  playBtn.innerHTML = paused ? "&#9654;" : "&#10074;&#10074;";
  workerMessage("state", {paused});
  syncAnimationLoop();
});
/* Alternate colouring modes are disabled in the public control while structure
   colouring is fixed. Restore this listener together with the button above to
   re-enable confidence and fluorescent mono rendering.
document.getElementById("mode").addEventListener("click", ()=>{
  mode = (mode+1)%3;
  applyMode();
});
*/
/* Speed adjustment listener is disabled while the public animation keeps its
   automatic rotation speed. Restore this listener with the input above to
   re-enable manual speed selection.
document.getElementById("spd").addEventListener("input", e=>{
  speedIsAutomatic = false;
  speed = +e.target.value;
});
*/

/* drag to rotate */
let dragging=false, lastX=0;
function bindCanvasInteractions(){
  scr.addEventListener("pointerdown", e=>{ dragging=true; lastX=e.clientX; scr.classList.add("drag"); scr.setPointerCapture(e.pointerId); });
  scr.addEventListener("pointermove", e=>{ if(!dragging) return; ang += (e.clientX-lastX)*0.008; lastX=e.clientX; workerMessage("state", {angle:ang}); });
  scr.addEventListener("pointerup",   e=>{ dragging=false; scr.classList.remove("drag"); });
  scr.addEventListener("pointercancel", ()=>{ dragging=false; scr.classList.remove("drag"); });
}
bindCanvasInteractions();

function bindCanvasZoomInteractions(){
  if (document.body.classList.contains("embed")) return;
  scr.addEventListener("wheel", e=>{
    e.preventDefault();
    if(e.shiftKey){
      D = Math.min(2.5, Math.max(1, D*Math.exp(-e.deltaY*0.0012)));
      densBtn.textContent = densLabel(Math.round(D*10)/10);
      workerMessage("state", {density:D});
      resize(); return;
    }
    const Zn = Math.min(8, Math.max(1, Z*Math.exp(e.deltaY*0.0015)));
    if(Zn === Z) return;
    const fr = Zn/Z;
    const mx = e.clientX - W/2, my = e.clientY - H/2;
    panX = mx - fr*(mx - panX);
    panY = my - fr*(my - panY);
    Z = Zn;
    if(Z < 1.02){ Z = 1; panX = 0; panY = 0; }
    workerMessage("state", {panX, panY});
    resize();
  }, {passive:false});
  scr.addEventListener("dblclick", ()=>{
    Z = 1; panX = 0; panY = 0;
    workerMessage("state", {panX:0, panY:0});
    resize();
  });
}
bindCanvasZoomInteractions();

const inkBtn = document.getElementById("ink");
inkBtn.textContent = inkLabel();
inkBtn.addEventListener("click", ()=>{
  // Keep the public cycle to solid and ASCII; the block ramp remains reversible via ?ink=block.
  INK = INK === "solid" ? "ascii" : "solid";
  RAMP = RAMPS[INK]; NR = RAMP.length - 1;
  inkBtn.textContent = inkLabel();
  workerMessage("state", {ink:INK, ramp:RAMP});
  resize();
});
const densBtn = document.getElementById("dens");
densBtn.addEventListener("click", ()=>{
  D = D >= 2 ? 1 : 2;
  densBtn.textContent = densLabel(D === 1 ? "1" : D);
  workerMessage("state", {density:D});
  resize();
});

applyMode();
startProteinWorker();
resize();
REDUCED_MOTION_QUERY.addEventListener("change", event=>{
  if(event.matches && !hostedMobile() && !paused){
    paused = true;
    pauseOrigin = "desktop-reduced";
  }
  workerMessage("state", {paused});
  syncAnimationLoop();
});
const pParam = parseInt(PARAMS.get("p") || "0", 10);
show(Number.isFinite(pParam) ? pParam : 0);
if(hostedMobile() && REDUCED_MOTION_QUERY.matches) render();
configureMobileAnimationLifecycle();
animationReady = true;
syncAnimationLoop();
</script>
